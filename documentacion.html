<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Documentacion institucional de Laika Club: ficha tecnica, carta usuario, analisis FODA, Business Canvas, Modelo de Madurez y Balance Scorecard.">
    <title>Documentación | Laika Club</title>
    <link rel="icon" type="image/x-icon" href="logos/icono.ico">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/components.js" defer></script>
</head>
<body>

    <laika-header></laika-header>
    <laika-sidebar></laika-sidebar>

    <main>

        <!-- PAGE HERO -->
        <section class="page-hero">
            <div class="container">
                <span class="label animate-reveal">Marco Estratégico</span>
                <h1 class="animate-reveal delay-1">Identidad Corporativa</h1>
                <p class="lead animate-reveal delay-2">
                    Documentación institucional de Laika Club. Consulta la ficha técnica, análisis estratégicos, modelo de negocio y perspectiva financiera de la organización.
                </p>
            </div>
        </section>

        <!-- PDF SECTION -->
        <section class="section">
            <div class="container">

                <div class="doc-tabs animate-reveal">
                    <button class="doc-tab active" data-pdf="doc/a) Ficha Técnica.pdf">Ficha Técnica</button>
                    <button class="doc-tab" data-pdf="doc/cu.pdf">Carta Usuario</button>
                    <button class="doc-tab" data-pdf="doc/foda.pdf">Análisis FODA</button>
                    <button class="doc-tab" data-pdf="doc/canvas.pdf">Business Canvas</button>
                    <button class="doc-tab" data-pdf="doc/madurez.pdf">Modelo de Madurez</button>
                    <button class="doc-tab" data-pdf="doc/Perspectiva Financiera.pdf">Balance Scorecard</button>
                </div>

                <div class="pdf-container animate-reveal delay-2">
                    <iframe id="pdf-frame" src="doc/a) Ficha Técnica.pdf" title="Documento institucional Laika Club"></iframe>
                </div>

            </div>
        </section>

    </main>

    <laika-footer></laika-footer>
    <script src="js/script.js"></script>
</body>
</html>
